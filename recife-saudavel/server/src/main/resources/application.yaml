ktor:
  deployment:
    port: 8080
    # Only read in development mode (:server:runDev): the classes Ktor reloads on change.
    watch:
      - classes
  application:
    modules:
      - grupotp.recifesaudavel.server.ApplicationKt.module

database:
  jdbcUrl: "$DATABASE_JDBC_URL:jdbc:h2:file:./data/recife-saudavel"
  driver: "$DATABASE_DRIVER:org.h2.Driver"
  user: "$DATABASE_USER:sa"
  password: "$DATABASE_PASSWORD:"

cors:
  # Web origins allowed to call the API, comma-separated. The default is the Metro dev server.
  allowedOrigins: "$CORS_ALLOWED_ORIGINS:http://localhost:8081"

sessions:
  # Days a session survives without any request; each request starts the count again. 0 = never expires.
  idleDays: "$SESSION_IDLE_DAYS:180"

jwt:
  # HS256 key of the session tokens, at least 32 bytes; generate one with `openssl rand -base64 48`.
  # Required: the server does not start without it. The Gradle run, runDev and test tasks supply a development key.
  secret: "$JWT_SECRET:"
  issuer: "recife-saudavel-server"
  audience: "recife-saudavel-app"
  # Sent in WWW-Authenticate, so ASCII only.
  realm: "recife-saudavel"
