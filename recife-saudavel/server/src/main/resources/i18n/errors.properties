# Texts of the error codes (grupotp.recifesaudavel.common.api.ErrorCode), in Brazilian Portuguese.
# Read as UTF-8. Formatted with java.text.MessageFormat: {0} is the first argument, and a single
# quote must be written twice ('').
SESSION_EXPIRED=Sua sessão expirou. Entre de novo para continuar.
WRONG_CREDENTIALS=E-mail ou senha incorretos.
EMAIL_TAKEN=E-mail já cadastrado.
FULL_NAME_REQUIRED=Nome completo é obrigatório.
EMAIL_INVALID=Informe um e-mail válido.
PASSWORD_TOO_SHORT=Mínimo {0} caracteres.
CURRENT_PASSWORD_WRONG=Senha atual incorreta.
PASSWORD_UNCHANGED=A nova senha precisa ser diferente da atual.
PRIMARY_PHONE_REQUIRED=Telefone principal é obrigatório.
PHONE_INVALID=Telefone inválido.
PRIVACY_POLICY_REQUIRED=Leitura da Política de Privacidade é obrigatória.
TREATMENT_CONSENT_REQUIRED=Consentimento de tratamento de dados é necessário.
BIRTH_DATE_REQUIRED=Informe sua data de nascimento.
BIRTH_DATE_INVALID=Informe uma data de nascimento válida.
REASON_REQUIRED=Descreva o motivo da consulta.
INTENSITY_OUT_OF_RANGE=Intensidade deve ser de {0} a {1}.
TEXT_TOO_LONG=Texto muito longo. Use até {0} caracteres.
INVALID_CHOICE=Especialidade, profissional ou clínica inválidos.
CLINIC_REQUIRED=Escolha a clínica do horário.
DATE_UNAVAILABLE=Escolha uma data disponível.
TIME_UNAVAILABLE=Escolha um horário disponível.
SLOT_TAKEN=Este horário acabou de ser ocupado. Escolha outro horário.
PRE_TRIAGE_NOT_FOUND=Pré-triagem não encontrada.
PRE_TRIAGE_ALREADY_ATTACHED=Esta pré-triagem já está vinculada a outra consulta.
APPOINTMENT_NOT_FOUND=Consulta não encontrada.
APPOINTMENT_NOT_CANCELLABLE=Esta consulta não pode mais ser cancelada.
