# PWA do Recife Saudável. As rotas /api, /healthz e /readyz vão para o servidor Ktor
# pelo Ingress; aqui só ficam os arquivos do export web do Expo.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Arquivos com hash no nome: podem ficar em cache por muito tempo.
    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker e manifesto: sempre revalidar, para a atualização do app chegar.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Saúde do próprio nginx (probe do Kubernetes).
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Um só index.html para todos os endereços: a navegação é feita pelo app Kotlin.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
