# AppProject + Application do Recife Saudável (namespace recifesaudavel, node a, a-ca).
# Este arquivo NÃO é sincronizado pelo ArgoCD: depois de alterar, aplicar no a-ca com
#   sudo k3s kubectl apply -f argocd/application.yaml
# Repo público: o ArgoCD lê via HTTPS sem credencial.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: recifesaudavel
  namespace: argocd
spec:
  description: Recife Saudável (PI Senac PE 2026.2), no a-ca.
  sourceRepos:
    - https://github.com/GrupoTP/App-Recife-Saudavel-Senac-PE-2026.2.git
  destinations:
    - namespace: recifesaudavel
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: recifesaudavel
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: recifesaudavel
  source:
    repoURL: https://github.com/GrupoTP/App-Recife-Saudavel-Senac-PE-2026.2.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: recifesaudavel
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
