# PWA (export web do Expo) servido pelo nginx, no node temp-br.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rs-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rs-web
  template:
    metadata:
      labels:
        app: rs-web
    spec:
      nodeSelector:
        kubernetes.io/hostname: temp-br
      tolerations:
        - key: polyclub.games/temp-br
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: web
          image: ghcr.io/grupotp/rs-web   # tag fixada no kustomization.yaml
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { memory: 64Mi }
          readinessProbe:
            httpGet: { path: /nginx-health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /nginx-health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: rs-web
spec:
  selector:
    app: rs-web
  ports:
    - name: http
      port: 80
      targetPort: http
