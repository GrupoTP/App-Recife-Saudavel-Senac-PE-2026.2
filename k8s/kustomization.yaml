# Recife Saudável — GitOps em recifesaudavel.grupotp.polyclub.com.br (node a, a-ca).
# Gerenciado pelo ArgoCD (Application em ../argocd/application.yaml, aplicada à mão no a-ca).
# Este diretório é PÚBLICO: nenhum segredo em texto puro aqui. O JWT_SECRET (sealedsecret.yaml)
# e a senha do MySQL (sealedsecret-recife-saudavel-mysql-credenciais.yaml) só como SealedSecret,
# que só o controller sealed-secrets do cluster consegue abrir.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: recifesaudavel

labels:
  - pairs:
      app.kubernetes.io/part-of: recife-saudavel
    includeSelectors: false

resources:
  - namespace.yaml
  - configmap.yaml
  - sealedsecret.yaml
  - sealedsecret-recife-saudavel-mysql-credenciais.yaml
  - server.yaml
  - web.yaml
  - ingress.yaml

images:
  # Imagens públicas no ghcr.io, publicadas pelo workflow .github/workflows/publish-images.yml.
  # Tag FIXADA (sem ArgoCD Image Updater): sha-<7 chars> do commit que gerou a imagem
  # (aba Actions ou página do pacote). sha-c1095b0 = merge do PR #2.
  # Para atualizar o app depois: novo commit -> novo build -> trocar as tags aqui.
  - name: ghcr.io/grupotp/rs-server
    newTag: sha-c1095b0
  - name: ghcr.io/grupotp/rs-web
    newTag: sha-c1095b0
