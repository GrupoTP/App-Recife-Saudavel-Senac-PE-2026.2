# Servidor Ktor (API /api/v1, /healthz e /readyz), no node temp-br.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rs-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rs-server
  template:
    metadata:
      labels:
        app: rs-server
    spec:
      nodeSelector:
        kubernetes.io/hostname: temp-br
      tolerations:
        - key: polyclub.games/temp-br
          operator: Equal
          value: "true"
          effect: NoSchedule
      # Imagem pública no ghcr.io: não precisa de imagePullSecrets.
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z 10.0.0.180 3306; do echo 'Aguardando MySQL nativo do temp-br...'; sleep 3; done"]
          resources:
            requests: { cpu: 10m, memory: 8Mi }
            limits:   { memory: 32Mi }
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: server
          image: ghcr.io/grupotp/rs-server   # tag fixada no kustomization.yaml
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: rs-config
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: { name: rs-secrets, key: DATABASE_PASSWORD }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: rs-secrets, key: JWT_SECRET }
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits:   { memory: 768Mi }
          # A JVM demora para subir: o startupProbe segura as outras probes até 2 min.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 24
          # /healthz não consulta o banco: queda do MySQL não reinicia o pod.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
          # /readyz inclui o banco: sem MySQL o pod sai do Service.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rs-server
spec:
  selector:
    app: rs-server
  ports:
    - name: http
      port: 80
      targetPort: http
