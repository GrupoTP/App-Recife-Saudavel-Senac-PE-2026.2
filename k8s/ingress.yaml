# Um só host: /api, /healthz e /readyz vão para o servidor; o resto, para o PWA.
# São as mesmas rotas que o service worker trata como "do servidor" (WorkerRequestRouter).
# /healthz e /readyz usam Prefix, não Exact: o Traefik dá prioridade pelo tamanho da regra,
# e Path(`/readyz`) empata com PathPrefix(`/`) (15 caracteres cada), então o PWA podia
# responder no lugar do servidor. PathPrefix(`/readyz`) é mais longa e sempre ganha.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rs-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - recifesaudavel.grupotp.polyclub.com.br
      secretName: recifesaudavel-tls
  rules:
    - host: recifesaudavel.grupotp.polyclub.com.br
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: rs-server
                port:
                  name: http
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: rs-server
                port:
                  name: http
          - path: /readyz
            pathType: Prefix
            backend:
              service:
                name: rs-server
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rs-web
                port:
                  name: http
