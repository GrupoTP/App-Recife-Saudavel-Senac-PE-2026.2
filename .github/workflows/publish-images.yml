# Publica as imagens do Recife Saudável no GitHub Container Registry (ghcr.io):
#   ghcr.io/grupotp/rs-server  servidor Ktor (porta 8080)
#   ghcr.io/grupotp/rs-web     PWA (export web do Expo) servido pelo nginx (porta 8080)
# Usa só o GITHUB_TOKEN automático. O submódulo é público e vem por HTTPS.
name: Publish images

on:
  push:
    branches: [main]
    paths:
      - "recife-saudavel/**"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

env:
  # Endereço público da API, gravado no bundle do PWA (mesmo host do app).
  API_BASE_URL: https://recifesaudavel.grupotp.polyclub.com.br

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: server
            image: ghcr.io/grupotp/rs-server   # ghcr exige minúsculas
            title: Recife Saudável (servidor)
          - target: web
            image: ghcr.io/grupotp/rs-web
            title: Recife Saudável (PWA)
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # O .gitmodules usa a URL SSH (git@github.com:...), que o runner não tem como usar.
      # O insteadOf troca por HTTPS só neste comando, sem mexer no .gitmodules.
      - name: Submódulo por HTTPS
        run: |
          git -c url."https://github.com/".insteadOf="git@github.com:" \
            submodule update --init --depth 1 recife-saudavel/grupotp-kotlin-react-native

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login no ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados (tags e labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=${{ matrix.title }}

      - name: Build e push
        uses: docker/build-push-action@v7
        with:
          context: recife-saudavel
          target: ${{ matrix.target }}
          build-args: |
            API_BASE_URL=${{ env.API_BASE_URL }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
